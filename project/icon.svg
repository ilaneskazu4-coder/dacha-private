<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1b4d"/><stop offset="0.55" stop-color="#d9593a"/><stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2b0"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#sky)"/>
  <circle cx="256" cy="330" r="200" fill="url(#sun)"/>
  <!-- far pines -->
  <g fill="#3b2a52">
    <polygon points="40,360 80,230 120,360"/><polygon points="100,370 150,200 200,370"/>
    <polygon points="330,370 380,210 430,370"/><polygon points="400,360 445,240 490,360"/>
  </g>
  <!-- ground -->
  <path d="M0 400 Q256 350 512 400 L512 512 L0 512 Z" fill="#1f4a2b"/>
  <path d="M0 440 Q256 400 512 440 L512 512 L0 512 Z" fill="#17381f"/>
  <!-- stump -->
  <ellipse cx="256" cy="470" rx="120" ry="22" fill="#0e2414" opacity=".5"/>
  <!-- body (red plaid) -->
  <rect x="176" y="270" width="160" height="170" rx="34" fill="#b3261e"/>
  <g stroke="#6e130e" stroke-width="10" opacity=".7">
    <line x1="216" y1="270" x2="216" y2="440"/><line x1="256" y1="270" x2="256" y2="440"/><line x1="296" y1="270" x2="296" y2="440"/>
    <line x1="176" y1="320" x2="336" y2="320"/><line x1="176" y1="380" x2="336" y2="380"/>
  </g>
  <!-- legs -->
  <rect x="196" y="430" width="52" height="46" rx="10" fill="#2a4a7a"/><rect x="264" y="430" width="52" height="46" rx="10" fill="#2a4a7a"/>
  <!-- head -->
  <rect x="196" y="160" width="120" height="120" rx="30" fill="#e0a77a"/>
  <!-- beard -->
  <path d="M196 235 Q256 330 316 235 L316 262 Q256 330 196 262 Z" fill="#7a4a22"/>
  <!-- eyes -->
  <circle cx="232" cy="215" r="9" fill="#2b1b12"/><circle cx="280" cy="215" r="9" fill="#2b1b12"/>
  <!-- hat -->
  <path d="M184 178 Q256 80 328 178 Z" fill="#f08a1c"/>
  <rect x="184" y="168" width="144" height="26" rx="12" fill="#c96a0c"/>
  <circle cx="256" cy="108" r="18" fill="#ffd27a"/>
  <!-- axe -->
  <line x1="356" y1="470" x2="420" y2="250" stroke="#6b4423" stroke-width="22" stroke-linecap="round"/>
  <path d="M400 232 Q470 220 478 290 Q430 300 396 280 Z" fill="#d7dbe2"/>
  <path d="M400 232 Q470 220 478 290" fill="none" stroke="#fff" stroke-width="6" opacity=".7"/>
  <!-- arm -->
  <rect x="318" y="320" width="56" height="40" rx="18" fill="#b3261e" transform="rotate(-18 340 340)"/>
  <circle cx="372" cy="334" r="20" fill="#e0a77a"/>
</svg>
